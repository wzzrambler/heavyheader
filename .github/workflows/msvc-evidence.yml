name: MSVC 证据

# 为什么单独一个工作流
# --------------------
# R6（MSVC 未实测）一直关不掉：本地 `vcvars64.bat` 定位 Windows SDK 依赖
# `reg.exe`，被开发机的安全策略拦截，绕不过去（也不该绕）。GitHub 的
# windows-latest 镜像自带完整 MSVC 且不受该策略限制，因此把「用 MSVC 真跑一次」
# 放进 CI，用产物而不是口头声明来关闭这个缺口。
#
# 判定标准（写死在这里，避免以后口头解释）：
#   1. `scan --compiler cl` 能产出非零编译单元，且失败单元为 0；
#   2. `gate` 在树未变时通过；
#   3. 产物（JSON/Markdown）作为 artifact 上传，任何人可下载复核。
# 任一条不满足，工作流失败——不许用「跑过了」代替「跑对了」。
#
# 诊断为什么写进 job summary：失败时公开页面只说「exit code 1」，日志需要
# 登录才能看。把每条命令的输出尾部写进 $GITHUB_STEP_SUMMARY，失败原因就能
# 被任何人（包括没有仓库权限的评审）直接读到。

on:
  push:
    branches: [main]
    paths:
      - "src/heavyheader/**"
      - "benchmarks/cases/demo/**"
      - ".github/workflows/msvc-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    name: MSVC 扫描与门禁
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: pip install -e .

      # 该 action 通过 vswhere 找到 VS 安装并注入环境变量，不依赖 reg.exe 的
      # 注册表查询路径，因此在本机被拦的那个环节在 runner 上不存在。
      - name: 启用 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确认编译器
        shell: pwsh
        # `cl` 无参数时打印横幅并以非零码退出；把它直接当步骤命令会让这一步
        # 因退出码非零而失败，看起来像 MSVC 没装好。只取前几行并显式成功收尾，
        # 把判断留给后面的「编译单元数」校验——那个才是真判据。
        run: |
          cl 2>&1 | Select-Object -First 3
          Write-Host "MSVC 环境已注入"
          "cl 版本：$(cl 2>&1 | Select-Object -First 1)" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: 扫描（MSVC）
        shell: pwsh
        run: |
          python -m heavyheader scan benchmarks/cases/demo `
            -I benchmarks/cases/demo/include `
            --compiler cl --jobs 1 --format json `
            -o msvc-scan.json 2>&1 | Tee-Object -FilePath scan.log
          $code = $LASTEXITCODE

          "scan exit=$code" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) {
            $shown = @(Get-Content scan.log | Where-Object { $_ -match '\S' } | Select-Object -Last 5)
            foreach ($line in $shown) { Write-Host "::error::scan: $line" }
            exit $code
          }

      - name: 校验收到的编译单元
        shell: pwsh
        # 允许「跑通但数字小」，不允许「跑通但一个单元都没成功」——后者说明
        # 我们其实没测到 MSVC，只是没报错。
        run: |
          $data = Get-Content msvc-scan.json -Raw | ConvertFrom-Json
          $ok = $data.totals.translation_units
          $failed = $data.totals.failed_translation_units
          "编译单元 $ok，失败 $failed" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "编译单元: $ok, 失败: $failed"
          if ($ok -lt 1) { Write-Error "MSVC 扫描没有成功单元，R6 仍未关闭"; exit 1 }
          if ($failed -ne 0) { Write-Error "有 $failed 个单元编译失败"; exit 1 }

      - name: 门禁（无回归应通过）
        shell: pwsh
        # 失败原因用 `::error::` 注解暴露：注解会出现在运行页面的 Annotations
        # 区块，**不需要登录**就能读；而普通日志与 job summary 在公开页面上
        # 拿不到。远程排障时这是唯一可靠的通道。
        run: |
          $lines = python -m heavyheader gate benchmarks/cases/demo `
            -I benchmarks/cases/demo/include `
            --compiler cl --jobs 1 --baseline msvc-scan.json 2>&1 |
            Tee-Object -FilePath gate.log
          $code = $LASTEXITCODE
          Write-Host "gate exit=$code"

          if ($code -ne 0) {
            $shown = @($lines | Where-Object { $_ -match '\S' } | Select-Object -Last 8)
            foreach ($line in $shown) { Write-Host "::error::gate: $line" }
            exit $code
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: msvc-evidence
          path: |
            msvc-scan.json
            scan.log
            gate.log
          retention-days: 90
