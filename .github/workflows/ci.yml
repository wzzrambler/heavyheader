name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: pip install -e ".[dev]"

      - name: 运行测试
        run: pytest -q

      - name: 编译检查
        run: python -m compileall -q src

  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests

  # 自举：用 HeavyHeader 分析一个真实 C++ 项目。
  # 这一步同时也是集成测试——它验证工具在非 Windows、非 MinGW 的工具链下
  # 也能正确解析编译器输出。
  self-scan:
    name: 自举扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: 准备一个真实的 C++ 工程
        run: |
          mkdir -p /tmp/selftest/include /tmp/selftest/app
          cat > /tmp/selftest/include/core.h <<'EOF'
          #pragma once
          #include <vector>
          #include <map>
          struct Core { std::vector<int> v; std::map<int,int> m; };
          EOF
          cat > /tmp/selftest/include/bloated.h <<'EOF'
          #pragma once
          #include <regex>
          #include <iostream>
          int bloated();
          EOF
          cat > /tmp/selftest/app/main.cpp <<'EOF'
          #include "core.h"
          #include "bloated.h"
          int main() { Core c; return c.v.size(); }
          EOF

      - name: 扫描
        run: |
          heavyheader scan /tmp/selftest --compiler g++ --std c++17 \
            -I /tmp/selftest/include --format json -o /tmp/scan.json
          python -c "
          import json
          data = json.load(open('/tmp/scan.json'))
          assert data['totals']['translation_units'] >= 1, '未发现编译单元'
          assert data['totals']['attributed_lines'] > 0, '归因行数为 0'
          print('自举扫描通过：', data['totals'])
          "

      - name: 门禁自检
        run: |
          heavyheader scan /tmp/selftest --compiler g++ --std c++17 \
            -I /tmp/selftest/include --save /tmp/baseline.json
          heavyheader gate /tmp/selftest --compiler g++ --std c++17 \
            -I /tmp/selftest/include --baseline /tmp/baseline.json \
            --max-regression 50 && echo "门禁自检通过"
