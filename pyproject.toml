[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heavyheader"
version = "0.1.0"
description = "C/C++ 构建效能治理平台：用编译器自身的输出归因头文件成本，定位可精简的 include，并在 CI 中门禁成本回归"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["c++", "build-system", "include", "compiler", "devtools", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/https://github.com/wzzrambler/heavyheader"
Documentation = "https://github.com/https://github.com/wzzrambler/heavyheader/tree/main/docs"
Repository = "https://github.com/https://github.com/wzzrambler/heavyheader"
Issues = "https://github.com/https://github.com/wzzrambler/heavyheader/issues"

[project.scripts]
heavyheader = "heavyheader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
